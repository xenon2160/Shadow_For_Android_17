plugins {
    id 'com.android.application'
}

android {
    // 注意：namespace 保持原值（Java 类/R 引用不变），仅改对外包名 applicationId
    namespace 'com.kankan.globaltraveling'
    // 编译到最新平台（Android 16+）。若提示缺少 SDK，让 Android Studio 自动下载即可。
    // 运行时兼容性由 HookMain 内的反射 + 安全 Hook 保证，不依赖 compileSdk。
    compileSdk 36

    defaultConfig {
        // 已改包名（防检测/隔离安装）。改包名后需同步：高德 Key 的包名、
        // LSPosed 作用域、KernelSU 授权（见 README）。
        applicationId "com.xenon.shadow2"
        minSdk 26
        // 保持 targetSdk 34：Android 17 仍完全兼容，且避免 targetSdk 35+ 的
        // 强制沉浸式(edge-to-edge)等行为变化影响现有 UI。
        targetSdk 34
        versionCode 22
        versionName "2.2.5"

        // 只打包 arm64，减小体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 固定 CI 调试签名：高德 Key 绑定「包名 + 签名 SHA1」，
    // 若用默认随机 debug 签名，每次 CI 构建 SHA1 都会变，导致高德 Key 反复失效。
    // 本 keystore 仅供 CI debug 构建使用（密码 android），SHA1 恒为：
    // 09:F4:55:2F:EE:41:0E:DA:81:27:01:3C:47:74:B5:EE:4D:38:76:9C
    signingConfigs {
        debug {
            storeFile file("../ci-debug.keystore")
            storePassword "android"
            keyAlias "ci"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // 生成 BuildConfig.APPLICATION_ID：HookMain 用它跳过自身包名、
        // Key 弹窗用它展示包名，改包名时代码无需任何修改
        buildConfig = true
    }

    // 16KB 内存页适配（澎湃OS 4 等新机型）：
    // 高德 3dmap 10.0.600 官方已适配 16KB，.so 直接以未压缩+对齐方式存放（AGP 9 自动 16KB 对齐），
    // 系统兼容性校验通过，不再弹「未按16KB内存页适配」提醒。
    // （旧的 useLegacyPackaging=true 会让系统无法校验对齐而每次启动弹提示，已移除）
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0' // 必须有这个
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // 高德地图 & 搜索
    // 3dmap 10.0.600：官方适配 Android 15/16+ 与 16KB 内存页设备（澎湃OS 4 等新机型必需），
    // 旧版 9.8.2 在这些设备上会因 so 加载失败而崩溃。
    // search 必须用 9.7.0：9.7.1 起新增了 com.amap.apis.utils.core.api 类，
    // 与 3dmap 10.0.600 内的同名类冲突（Duplicate class 编译失败），9.7.0 不含该类且 API 完全兼容。
    implementation 'com.amap.api:3dmap:10.0.600'
    implementation 'com.amap.api:search:9.7.0'

    // LSPosed
    compileOnly 'de.robv.android.xposed:api:82'
}
