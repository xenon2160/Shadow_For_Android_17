name: Build APK

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ] # 推送 v 开头的 tag 时自动构建并发布 Release
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # 推送 v* tag 时自动创建 GitHub Release 并附上 APK（永久公开下载链接）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Shadow-debug-apk
          path: apk

      - name: Rename APK with version
        run: mkdir -p out && cp apk/app-debug.apk "out/Shadow-${GITHUB_REF_NAME}-debug.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
